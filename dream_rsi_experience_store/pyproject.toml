[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dream-rsi-experience-store"
version = "0.1.0"
requires-python = ">=3.11"
description = "Three-table Dream-RSI replay store for historical Codex/autoresearch experience"

[tool.setuptools.packages.find]
where = ["src"]
